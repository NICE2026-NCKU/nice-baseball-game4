<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="耐斯洗髮粉 × Walkii 遊戲化企畫評審試玩版">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>好球少年：我的職棒夢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@900&family=LXGW+WenKai+TC&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: one phone-width column; a retro scoreboard top bar, the field map as home base, each level a stack of full-width "cards" like a vintage baseball program. Single deliberate look (brand packaging colors). */
:root{
  --paper:#F4ECDD; --paper-2:#EADFC9; --ink:#1B2B45; --navy:#1F3B66; --red:#C8312B;
  --gold:#E2A92B; --grass:#2F7A45; --grass-2:#286B3C; --dirt:#C98A5A; --muted:#6B6A66;
  --ok:#2F7A45; --line:#D5C7AE;
  --display:"Noto Serif TC","Songti TC",serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --hand:"LXGW WenKai TC","Kaiti TC","DFKai-SB",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:#14243D;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
#phone{max-width:440px;margin:0 auto;min-height:100%;background:var(--paper);position:relative;display:flex;flex-direction:column;
  background-image:radial-gradient(rgba(27,43,69,.05) 1px,transparent 1px);background-size:6px 6px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:#F4ECDD;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--red)}
.topbar .brand{font-weight:900;letter-spacing:.04em;font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .brand small{display:block;font-weight:400;opacity:.75;font-size:11px;letter-spacing:.08em}
.bases{display:flex;gap:6px}
.bases i{width:12px;height:12px;transform:rotate(45deg);border:2px solid #F4ECDD;display:block;opacity:.5}
.bases i.on{background:var(--gold);border-color:var(--gold);opacity:1}
.steps-pill{font-variant-numeric:tabular-nums;font-size:12px;background:rgba(255,255,255,.12);padding:3px 9px;border-radius:99px;white-space:nowrap}
main{flex:1;padding-block:18px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:30px}
h2{font-size:22px}
h3{font-size:17px}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--red);font-weight:700}
.card{background:#FBF6EC;border:2px solid var(--ink);border-radius:6px;padding:16px;box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;gap:12px}
.story{font-family:var(--hand);font-size:17px;line-height:1.85}
.btn{appearance:none;border:2px solid var(--ink);background:var(--red);color:#FFF8EC;font:900 16px var(--body);letter-spacing:.06em;
  padding:13px 18px;border-radius:6px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;width:100%;transition:transform .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.navy{background:var(--navy)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.note{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:3px;letter-spacing:.06em}
.center{text-align:center}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.hero h1{font-size:34px;color:var(--navy)}
.hero h1 span{color:var(--red)}
.hero .sub{font-family:var(--hand);font-size:17px}
.boy{width:170px;height:auto}
.boy.sm{width:110px}
.ribbon{background:var(--red);color:#FFF8EC;font-weight:900;letter-spacing:.1em;padding:4px 14px;font-size:13px;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}

/* map */
.field{width:100%;max-width:400px;margin:0 auto;display:block}
.lv{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid var(--ink);border-radius:6px;background:#FBF6EC;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.lv .no{flex:none;width:42px;height:42px;display:grid;place-items:center;font:900 13px var(--body);background:var(--navy);color:var(--paper);border-radius:4px;line-height:1.1;text-align:center}
.lv .t{flex:1;min-width:0}
.lv .t b{display:block;font-family:var(--display);font-size:16px}
.lv .t small{color:var(--muted);font-size:12px}
.lv .st{font-size:12px;font-weight:700;white-space:nowrap}
.lv.done .no{background:var(--gold);color:var(--ink)}
.lv.locked{opacity:.5;cursor:not-allowed}
.lv.home .no{background:var(--red)}
.lv-list{display:flex;flex-direction:column;gap:8px}

/* walk */
.ring{width:190px;height:190px;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .num b{font:900 34px var(--body);font-variant-numeric:tabular-nums;display:block;line-height:1}
.ring .num small{font-size:12px;color:var(--muted)}
.track{height:64px;border-bottom:4px dashed var(--dirt);position:relative;overflow:hidden}
.track .walker{position:absolute;bottom:0;left:0;width:56px;transition:left 1.6s linear}
.walking .walker svg{animation:bob .3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px) rotate(3deg)}}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.opt{appearance:none;width:100%;text-align:left;font:700 15px var(--body);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:11px 14px;cursor:pointer;display:flex;gap:10px;align-items:center}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:12px}
.opt.right{background:#DCEBD9;border-color:var(--ok)}
.opt.right .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{background:#F5D9D4;border-color:var(--red)}
.opts{display:flex;flex-direction:column;gap:8px}
.explain{background:var(--paper-2);border-left:4px solid var(--gold);padding:10px 12px;font-size:14px;border-radius:0 4px 4px 0}

/* wash */
.washstage{position:relative;width:100%;max-width:300px;aspect-ratio:1/1;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.washstage svg.boyw{position:absolute;inset:0;width:100%;height:100%}
.washstage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,rgba(255,255,255,.55) 40%,rgba(180,210,240,.35));border:1px solid rgba(120,150,190,.5);pointer-events:none;animation:pop 1.4s ease-out forwards}
@keyframes pop{0%{transform:scale(.3);opacity:1}70%{opacity:1}100%{transform:scale(1.15) translateY(-14px);opacity:0}}
.meter{height:12px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--paper)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--navy),#5B8FD0);transition:width .2s}
.basin{display:flex;align-items:flex-end;justify-content:center;gap:18px}
.cup{width:96px;height:110px;border:3px solid var(--ink);border-top:none;border-radius:0 0 14px 14px;position:relative;overflow:hidden;background:linear-gradient(to top,#BFD9EE 70%,transparent 70%)}
.cup .cap{position:absolute;left:50%;top:-60px;width:46px;height:36px;margin-left:-23px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 40% 35%,#fff,#EFE6D2 60%);border:2px solid #9AA9B8;transition:top .6s cubic-bezier(.5,0,.8,1),opacity 1.2s,transform 1.2s}
.cup .cap.in{top:52px}
.cup .cap.melt{opacity:0;transform:scale(1.6)}
.cup .powder{position:absolute;inset:auto 0 0 0;height:70%;background:radial-gradient(circle,rgba(255,255,255,.95) 1px,transparent 2px);background-size:8px 8px;opacity:0;transition:opacity 1.2s}
.cup .powder.on{opacity:1}
.capsule-pick{width:120px;cursor:pointer;border:2px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--ink);background:#fff}

/* pack */
.gear{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gear button{appearance:none;border:2px solid var(--ink);border-radius:6px;background:var(--paper);padding:8px 4px;font:700 12px var(--body);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.gear button svg{width:40px;height:40px}
.gear button.packed{opacity:.25;pointer-events:none}
.box-art{width:150px;margin:0 auto;display:block}
.issues{display:grid;gap:8px}
.issue{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.issue b{flex:none;background:var(--navy);color:var(--paper);font-size:12px;padding:2px 7px;border-radius:3px;margin-top:2px}

/* story hall */
.hall{display:grid;gap:10px}
.sv{appearance:none;text-align:left;font:inherit;color:inherit;width:100%;display:grid;grid-template-columns:78px 1fr;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:#FBF6EC;cursor:pointer;padding:0}
.sv .yr{background:var(--navy);color:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;font:900 20px var(--display);line-height:1.1;padding:10px 4px;text-align:center}
.sv .yr small{font:700 11px var(--body);color:var(--paper);letter-spacing:.08em;margin-top:4px}
.sv .bd{padding:10px 12px;min-width:0}
.sv .bd b{display:block;font-family:var(--display);font-size:16px}
.sv .bd span{font-size:12px;color:var(--muted)}
.sv .bd .new{color:#fff;font-size:10px}
.sv.locked{opacity:.45;cursor:not-allowed}
.sv.locked .yr{background:var(--muted);color:var(--paper)}
.sv .new{display:inline-block;background:var(--red);color:#fff;font:900 10px var(--body);padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:middle;letter-spacing:.08em}
.yearhead{background:var(--navy);color:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:18px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:4px 4px 0 var(--red)}
.yearhead .y{font:900 56px var(--display);color:var(--gold);line-height:1}
.yearhead .pl{font-size:13px;letter-spacing:.12em}
.yearhead h2{color:var(--paper)}
.fact{display:flex;gap:10px;align-items:baseline;border-bottom:1px dashed var(--line);padding-block:6px;font-size:14px}
.fact b{flex:none;font:900 18px var(--display);color:var(--red);min-width:64px}
.link-ajin{background:var(--paper-2);border-left:4px solid var(--red);padding:10px 12px;font-family:var(--hand);font-size:16px;border-radius:0 4px 4px 0}
.src{font-size:12px;color:var(--muted)}
.src a{color:var(--navy)}
/* rewards */
.pcard{border:3px solid var(--navy);border-radius:8px;background:linear-gradient(160deg,#FBF6EC 60%,#F0DDB4);padding:14px;display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;position:relative;overflow:hidden}
.pcard::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;border:10px solid rgba(200,49,43,.15)}
.pcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.pcard dt{color:var(--muted)}
.pcard dd{margin:0;font-weight:700}
.badge{width:150px;height:150px;margin:0 auto;display:block;animation:spin-in .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes spin-in{from{transform:scale(0) rotate(-180deg)}to{transform:none}}
.unlock{font-size:13px;font-weight:700;color:var(--ok)}

/* redeem */
.qrwrap{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.qrwrap #qr img,.qrwrap #qr canvas{width:180px!important;height:180px!important}
.serial{font:700 15px ui-monospace,Menlo,monospace;letter-spacing:.12em}
.stamp{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);border:4px solid var(--red);color:var(--red);font:900 26px var(--display);padding:4px 14px;border-radius:6px;background:rgba(255,255,255,.85);letter-spacing:.1em}
.prod{width:100%;border-radius:6px;border:2px solid var(--ink);display:block}
.push{background:var(--navy);color:var(--paper);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--red)}
.push h3{color:var(--gold)}
.venues{display:grid;gap:6px;font-size:13px}
.venues div{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.08);padding:6px 10px;border-radius:4px}
.venues b{color:var(--gold);flex:none}

/* scan */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{appearance:none;border:2px solid var(--ink);background:var(--paper);border-radius:99px;padding:6px 12px;font:700 13px var(--body);color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper)}
.viewfinder{aspect-ratio:1/1;max-width:260px;width:100%;margin:0 auto;background:#0F1A2C;border-radius:10px;position:relative;overflow:hidden;display:grid;place-items:center}
.viewfinder .corner{position:absolute;width:36px;height:36px;border:4px solid var(--gold)}
.viewfinder .c1{top:22px;left:22px;border-right:none;border-bottom:none}
.viewfinder .c2{top:22px;right:22px;border-left:none;border-bottom:none}
.viewfinder .c3{bottom:22px;left:22px;border-right:none;border-top:none}
.viewfinder .c4{bottom:22px;right:22px;border-left:none;border-top:none}
.viewfinder .laser{position:absolute;left:30px;right:30px;height:3px;background:var(--red);box-shadow:0 0 12px var(--red);top:30px;animation:laser 1.4s ease-in-out infinite alternate}
@keyframes laser{to{top:calc(100% - 33px)}}
.viewfinder .poster{color:#F4ECDD;text-align:center;font-size:12px;opacity:.7}
.viewfinder .ok{position:absolute;inset:0;display:grid;place-items:center;background:rgba(47,122,69,.92);color:#fff;font:900 22px var(--body);animation:fade .3s both}

/* cheer */
.cheerbtn{width:150px;height:150px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--red);color:#FFF8EC;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);font:900 26px var(--display);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.cheerbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.floaty{position:absolute;font:900 18px var(--display);color:var(--red);pointer-events:none;animation:floaty .8s ease-out forwards}
@keyframes floaty{to{transform:translateY(-60px);opacity:0}}

/* home run anim */
.runfield{width:100%;max-width:320px;margin:0 auto;display:block}

/* ticket */
.ticket{background:var(--gold);border:2px solid var(--ink);border-radius:6px;padding:14px 16px;position:relative;display:flex;flex-direction:column;gap:4px;
  -webkit-mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.ticket .big{font:900 22px var(--display)}
.ticket .id{font:700 13px ui-monospace,Menlo,monospace;letter-spacing:.08em}

.okstamp{position:absolute;right:14px;top:12px;transform:rotate(-10deg);border:3px solid var(--ok);color:var(--ok);font:900 13px var(--body);padding:3px 8px;border-radius:4px;background:rgba(255,255,255,.8)}
.tk-list{display:grid;gap:6px}
.tk-row{display:flex;justify-content:space-between;align-items:center;gap:8px;border:2px dashed var(--ink);border-radius:4px;padding:6px 10px;font-size:13px}
.tk-row .id{font:700 13px ui-monospace,Menlo,monospace;letter-spacing:.06em}
.tk-row b{color:var(--ok)}
.tk-row.used{opacity:.55}.tk-row.used b{color:var(--muted)}
.prize{border:3px solid var(--red);border-radius:8px;background:#FFF8EC;padding:16px;text-align:center;display:flex;flex-direction:column;gap:6px;animation:spin-in .7s cubic-bezier(.2,1.4,.4,1) both}
.prize .p{font:900 24px var(--display);color:var(--red)}
.prizes{display:grid;gap:4px;font-size:13px}
.prizes div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding-block:4px}

.cert{border:4px double var(--navy);background:#FBF6EC;padding:18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.badges svg{width:62px;height:62px}
.footer-reset{display:flex;justify-content:center}
.linkbtn{appearance:none;background:none;border:none;color:var(--muted);font:13px var(--body);text-decoration:underline;cursor:pointer;padding:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="phone">
  <header class="topbar">
    <div class="brand">Walkii × 耐斯洗髮粉<small>好球少年：我的職棒夢・評審試玩版</small></div>
    <div class="bases" id="topBases" aria-label="關卡進度"><i></i><i></i><i></i><i></i></div>
    <div class="steps-pill" id="stepPill">0 步</div>
  </header>
  <main id="view"></main>
</div>

<script>
/* ---------- state ---------- */
const KEY='nice-walkii-demo-v1';
const fresh=()=>({done:[false,false,false,false],steps:0,redeemed:false,serial:'',tickets:0,ticketIds:[],prizes:[],venue:'',scans:0,l4:false,read:[]});
let S=fresh();
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.done))S=Object.assign(fresh(),s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const view=$('#view');
function topbar(){
  document.querySelectorAll('#topBases i').forEach((el,i)=>el.classList.toggle('on',S.done[i]));
  $('#stepPill').textContent=S.steps.toLocaleString()+' 步';
}
function go(html,after){view.innerHTML='<div class="fade" style="display:flex;flex-direction:column;gap:16px">'+html+'</div>';window.scrollTo({top:0});topbar();after&&after()}
const rand=n=>Array.from({length:n},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');

/* ---------- original character: 阿進 ---------- */
function boy({cap=true,oily=false,clean=false,bat=false,mood='grin'}={}){
  const skin='#C98B5A',skinD='#A86E44';
  const hair=`<path d="M58 78 Q60 40 100 36 Q142 38 144 80 L136 70 L130 82 L122 66 L112 80 L104 62 L94 80 L84 64 L76 80 L68 66 Z" fill="#1A1A1A"/>`;
  const capSvg=`<path d="M56 80 Q58 34 100 32 Q144 34 146 80 Z" fill="#1F3B66"/><path d="M50 80 Q100 70 160 82 Q166 92 150 92 Q104 84 52 88 Z" fill="#C8312B"/>
    <circle cx="100" cy="54" r="13" fill="#F4ECDD"/><text x="100" y="60" text-anchor="middle" font-family="Noto Serif TC,serif" font-weight="900" font-size="16" fill="#C8312B">進</text>`;
  const eyes= mood==='wow'
    ? `<circle cx="84" cy="108" r="6" fill="#1A1A1A"/><circle cx="118" cy="108" r="6" fill="#1A1A1A"/><circle cx="86" cy="106" r="2" fill="#fff"/><circle cx="120" cy="106" r="2" fill="#fff"/>`
    : mood==='ugh'
    ? `<path d="M77 106 l14 4 M125 106 l-14 4" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>`
    : `<path d="M77 109 Q84 101 91 109 M111 109 Q118 101 125 109" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  const mouth= mood==='ugh'
    ? `<path d="M88 136 Q100 128 114 136" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round"/>`

  </svg>
  <div class="lv-list">
    ${LV.map((l,i)=>{const d=S.done[i],lock=i>n;const st=d?'✓ 完成':lock?'🔒 未解鎖':(i===3&&!S.l4?'🔒 需現場掃碼':'挑戰');

/* ---------- stage runner ---------- */
function runStages(title,stages,done){
  let k=0;
  const header=()=>`<div><p class="eyebrow">${title}・${k+1}/${stages.length}</p></div>`;
  const next=()=>{k++; if(k>=stages.length) return done(); show()};
  const show=()=>stages[k](header(),next);
  show();
}

/* story */
const story=(h,text,art)=>(hd,next)=>go(`${hd}<div class="card">${art?`<div class="boy sm" style="margin:0 auto">${art}</div>`:''}<h2>${h}</h2><p class="story">${text}</p></div><button class="btn" id="nx">繼續</button>`,()=>$('#nx').onclick=next);

/* walk */
const walk=(goal,label)=>(hd,next)=>{
  const C=2*Math.PI*80;
  go(`${hd}<div class="card center"><h2>${label}</h2><p>真實活動中，玩家用 Walkii 累積 ${goal.toLocaleString()} 步才能解鎖本關任務。</p>
    <div class="ring"><svg viewBox="0 0 190 190"><circle cx="95" cy="95" r="80" fill="none" stroke="#EADFC9" stroke-width="16"/>
    <circle id="arc" cx="95" cy="95" r="80" fill="none" stroke="#C8312B" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
    <div class="num"><div><b id="cnt">0</b><small>/ ${goal.toLocaleString()} 步</small></div></div></div>
    <div class="track" id="track"><div class="walker" id="walker">${boy({})}</div></div></div>
    <button class="btn navy" id="go">模擬走 ${goal.toLocaleString()} 步</button>`,()=>{
    $('#go').onclick=()=>{
      const b=$('#go');b.disabled=true;b.textContent='走路中…';
      $('#track').classList.add('walking');
      requestAnimationFrame(()=>{$('#walker').style.left='calc(100% - 56px)'});
      const t0=performance.now(),D=1600;
      const tick=t=>{const p=Math.min(1,(t-t0)/D);const v=Math.round(goal*p);
        $('#cnt').textContent=v.toLocaleString();$('#arc').setAttribute('stroke-dashoffset',C*(1-p));
        if(p<1)requestAnimationFrame(tick);else{S.steps+=goal;save();topbar();$('#track').classList.remove('walking');
          b.disabled=false;b.textContent='步數達成！開始任務';b.classList.remove('navy');b.onclick=next;}};
      requestAnimationFrame(tick);
    };
  });
};

/* quiz */
const quiz=(title,qs)=>(hd,next)=>{
  let i=0,score=0;
  const show=()=>{const q=qs[i];
    go(`${hd}<div class="card"><div class="qhead"><span class="tag">${title}</span><span>第 ${i+1} / ${qs.length} 題</span></div>
      <h3>${q.q}</h3><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${'ABCD'[j]}</span>${o}</button>`).join('')}</div>
      <div id="ex"></div></div><button class="btn" id="nx" hidden>${i<qs.length-1?'下一題':'完成問答'}</button>`,()=>{
      document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
        if(b.parentNode.dataset.answered)return;b.parentNode.dataset.answered=1;
        const j=+b.dataset.j;const ok=j===q.a;if(ok)score++;
        document.querySelectorAll('.opt').forEach(x=>{if(+x.dataset.j===q.a)x.classList.add('right')});
        if(!ok)b.classList.add('wrong');
        $('#ex').innerHTML=`<div class="explain"><b>${ok?'答對了！':'差一點！'}</b> ${q.e}</div>`;
        $('#nx').hidden=false;
      });
      $('#nx').onclick=()=>{i++; if(i<qs.length)show(); else next()};
    });
  };
  show();
};

  function scrub(){
    go(`${hd}<div class="card center"><span class="tag">情境小遊戲</span><h2>用手指在阿進頭上搓出泡泡</h2>
      <div class="washstage" id="ws"><svg class="boyw" viewBox="0 0 200 240">${boy({cap:false,mood:'ugh'}).replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg><canvas id="cv"></canvas></div>
      <div class="meter" aria-label="清潔度"><i id="mt"></i></div><p class="note">清潔度 <b id="pct">0</b>%</p></div>
      <button class="btn navy" id="rinse" disabled>沖水！</button>`,()=>{
      const cv=$('#cv'),ws=$('#ws'),ctx=cv.getContext('2d');
      const r=ws.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
      cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.scale(dpr,dpr);
      const W=r.width,H=r.height,s=Math.min(W/200,H/240),ox=(W-200*s)/2,oy=(H-240*s)/2;
      const X=v=>ox+v*s,Y=v=>oy+v*s;
      // grease layer over hair/forehead region
      const region=()=>{ctx.beginPath();ctx.ellipse(X(100),Y(60),52*s,32*s,0,0,Math.PI*2);};
      ctx.save();region();ctx.clip();
      const g=ctx.createLinearGradient(0,Y(20),0,Y(110));g.addColorStop(0,'rgba(140,120,40,.85)');g.addColorStop(1,'rgba(110,95,30,.75)');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='rgba(255,255,230,.6)';ctx.lineWidth=3;for(let i=0;i<9;i++){ctx.beginPath();const x=X(58+i*10);ctx.moveTo(x,Y(40));ctx.quadraticCurveTo(x+6*s,Y(60),x-2*s,Y(96));ctx.stroke()}
      ctx.restore();
      ctx.globalCompositeOperation='destination-out';
      let total=0;{const d=ctx.getImageData(0,0,cv.width,cv.height).data;for(let i=3;i<d.length;i+=16)if(d[i]>0)total++}
      let down=false,last=0,done=false;
      const rub=e=>{if(!down||done)return;const b=cv.getBoundingClientRect();const x=e.clientX-b.left,y=e.clientY-b.top;
        ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fill();
        if(Math.random()<.5){const bb=document.createElement('div');bb.className='bubble';const s=10+Math.random()*22;
          bb.style.cssText=`width:${s}px;height:${s}px;left:${x-s/2+(Math.random()*20-10)}px;top:${y-s/2+(Math.random()*20-10)}px`;ws.appendChild(bb);setTimeout(()=>bb.remove(),1400)}
        const now=performance.now();if(now-last>120){last=now;const d=ctx.getImageData(0,0,cv.width,cv.height).data;let left=0;for(let i=3;i<d.length;i+=16)if(d[i]>0)left++;
          const p=Math.min(100,Math.round((1-left/total)*100/0.85));$('#mt').style.width=p+'%';$('#pct').textContent=p;
          if(p>=100){done=true;ctx.clearRect(0,0,W,H);$('#rinse').disabled=false;$('#rinse').textContent='泡泡夠多了，沖水！'}}};
      cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);rub(e)});
      cv.addEventListener('pointermove',rub);
      cv.addEventListener('pointerup',()=>down=false);cv.addEventListener('pointercancel',()=>down=false);
      $('#rinse').onclick=()=>{
        go(`${hd}<div class="card center"><span class="tag">洗好了！</span><div class="boy" style="margin:0 auto">${boy({cap:false,clean:true,mood:'wow'})}</div>
        <h2>好球看得過癮，<br>汗水洗得乾淨。</h2><p>少量水就能起泡、沖得乾淨。看球、練球揮汗之後，用耐斯洗髮粉把油膩一次洗掉。</p></div>
        <button class="btn" id="nx">繼續</button>`,()=>$('#nx').onclick=next);
      };
    });
  }
};
function level2(){
  runStages('第二關｜二壘：突破挑戰',[
    story('進階訓練開始了',
      '阿進入選鄉鎮代表隊。教練加練體能、守備和團隊默契，每天都練到太陽下山。<br><br>「想變強，除了身體，腦袋也要懂球！」教練拿出一本棒球規則手冊。',boy({bat:true})),
    walk(300,'體能訓練：折返跑'),
    quiz('棒球知識王',[
      {q:'打者累積幾個好球會被三振出局？',o:['2 個','3 個','4 個','5 個'],a:1,e:'三個好球三振。兩好球後打成界外球，好球數不會再增加。'},
      {q:'投手投出幾個壞球，打者可以保送上一壘？',o:['3 個','4 個','5 個','6 個'],a:1,e:'四壞球保送，打者直接上一壘。'},
      {q:'中華職棒是在哪一年正式開打？',o:['1984 年','1990 年','1997 年','2003 年'],a:1,e:'1990 年是中職元年。本次限定包裝就融入了中職元年的復古視覺。'},
    ]),
    wash,
    reward(2,'阿進的第一支安打',`<p class="story" style="font-size:15px;text-align:left">成長故事 2：區域賽第七局，兩出局、滿壘。阿進盯著球，用力一揮——球越過游擊手頭頂！看台上的阿公站起來大喊：「阮孫仔啦！」</p>
      <p class="unlock">能力提升：打擊 +10・守備 +8・團隊默契 +12</p>`),
  ],()=>{S.done[1]=true;save();map()});
}

const pack=(hd,next)=>{
  let n=0;
  go(`${hd}<div class="card center"><span class="tag">公益任務</span><h2>幫球隊打包愛心球具箱</h2><p>點選下面的球具，把它們裝進箱子，送到阿進的球隊。</p>
    <svg class="box-art" viewBox="0 0 150 110"><path d="M10 40 L75 20 L140 40 L140 100 L10 100 Z" fill="#C98A5A" stroke="#1B2B45" stroke-width="3"/><path d="M10 40 L75 58 L140 40 M75 58 V100" stroke="#1B2B45" stroke-width="3" fill="none"/>
    <text x="42" y="86" font-size="12" font-weight="900" fill="#1B2B45" font-family="Noto Sans TC,sans-serif" transform="rotate(8 42 86)">好球傳承</text><text id="boxN" x="108" y="88" text-anchor="middle" font-size="16" font-weight="900" fill="#C8312B" font-family="Noto Sans TC,sans-serif" transform="rotate(-8 108 88)">0/4</text></svg>
    <div class="gear">${GEAR.map((g,i)=>`<button data-i="${i}">${g[1]}${g[0]}</button>`).join('')}</div></div>
    <button class="btn" id="nx" disabled>球具箱打包完成</button>`,()=>{
    document.querySelectorAll('.gear button').forEach(b=>b.onclick=()=>{b.classList.add('packed');n++;$('#boxN').textContent=n+'/4';if(n===4)$('#nx').disabled=false});
    $('#nx').onclick=next;
  });
};
const issues=(hd,next)=>go(`${hd}<div class="card"><span class="tag">認識偏鄉棒球</span><h2>阿進的球隊遇到了困難</h2>
  <p class="story" style="font-size:16px">最後一階段選拔就要開始了，但球隊的狀況讓教練很頭痛：</p>
  <div class="issues">
   <div class="issue"><b>設備</b><span>手套破洞、球棒裂開，練習球縫了又縫，還是不夠用。</span></div>
   <div class="issue"><b>交通</b><span>去城市比賽要轉好幾趟車，車資和住宿都是負擔。</span></div>
   <div class="issue"><b>培訓</b><span>缺少專業教練與訓練場地，孩子只能靠熱情撐下去。</span></div>
  </div>
  <p class="note">遊戲情境依企畫「偏鄉棒球教育」主題設計；實際公益內容規劃與球芽基金合作（洽談中）。</p></div>
  <button class="btn" id="nx">我來幫忙！</button>`,()=>$('#nx').onclick=next);
function level3(){
  runStages('第三關｜三壘：好球永續傳',[
    story('最後的訓練挑戰',
      '阿進一路打進了選拔的最後階段。<br><br>可是那天練球，他的手套「啪」一聲裂開了。阿進沒說話，用膠帶一圈一圈纏起來，繼續接球。<br><br>耐斯一直在做的「愛地球」，不只是保護環境，也是把好東西傳給下一代。這一關，換你幫阿進一把。',boy({mood:'ugh'})),
    walk(500,'長距離耐力跑'),
    issues,
    pack,
    quiz('愛地球・減塑小測驗',[
      {q:'這次的中職聯名限定洗髮粉，用什麼取代了傳統的塑膠小包？',o:['鋁箔袋','植物性可溶膠囊','玻璃小瓶','紙盒分裝'],a:1,e:'植物性材質製成、遇水即溶，單顆即用，免去塑膠小包，減少包裝浪費。'},
    ]),
    reward(3,'獲得「好球傳承徽章」',`<p class="story" style="font-size:15px;text-align:left">成長故事 3：新的球具送到了！阿進戴上新手套，在選拔賽撲接了一個強勁滾地球，傳一壘——出局！球探在筆記本上寫下了他的名字。</p>
      <p class="unlock">✓ 一壘・二壘・三壘全部完成，解鎖限定商品兌換資格</p>`),
  ],()=>{S.done[2]=true;if(!S.serial)S.serial='NICE-'+rand(4)+'-'+rand(4);save();redeem()});
}

/* ---------- LEVEL 4 ---------- */
const VENUES=['臺北大巨蛋','臺中洲際棒球場','高雄澄清湖棒球場'];
function scanStage(hd,next,again){
  let v=S.venue||'';
  go(`${hd}<div class="card"><span class="tag">現場報到</span><h2>${again?'到另一場指定賽事再次報到':'到球場耐斯攤位掃碼，解鎖第四關'}</h2>
    <p>第四關不在線上開放。玩家必須在例行賽現場的耐斯攤位，用 Walkii 掃描活動區 QR Code，才會開啟第四關權限。</p>
    <p class="note">選擇你所在的球場（示意）：</p>
    <div class="chips">${VENUES.map(x=>`<button class="chip ${x===v?'on':''}" data-v="${x}">${x}</button>`).join('')}</div>
    <div class="viewfinder" id="vf"><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span><div class="laser"></div><div class="poster">將鏡頭對準<br>耐斯攤位的報到 QR Code</div></div></div>
    <button class="btn" id="scan" ${v?'':'disabled'}>模擬現場掃碼</button>`,()=>{
    document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{v=c.dataset.v;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));$('#scan').disabled=false});
    $('#scan').onclick=()=>{S.venue=v;S.scans++;save();$('#scan').disabled=true;
      setTimeout(()=>{$('#vf').insertAdjacentHTML('beforeend',`<div class="ok"><div class="center">✓ 報到成功<br><small style="font-size:14px;font-weight:700">${v}・耐斯攤位</small></div></div>`);
        $('#scan').disabled=false;$('#scan').textContent='繼續';$('#scan').onclick=next},900)};
  });
}
const cheer=(hd,next)=>{
  const goal=15;let n=0,ended=false;
  go(`${hd}<div class="card center"><span class="tag">應援任務</span><h2>幫阿進加油！</h2><p>連點 ${goal} 下應援鈕，讓全場的聲音推阿進衝回本壘。</p>
    <div style="position:relative" id="cz"><button class="cheerbtn" id="cb">加油！</button></div>
    <div class="meter"><i id="cm"></i></div><p class="note"><b id="cn">0</b> / ${goal}</p></div>
    <button class="btn" id="nx" disabled>阿進，衝啊！</button>`,()=>{
    const words=['衝啊！','好球！','阿進！','加油！','全壘打！'];
    $('#cb').onclick=e=>{if(ended)return;n++;$('#cn').textContent=n;$('#cm').style.width=(n/goal*100)+'%';
      const f=document.createElement('span');f.className='floaty';f.textContent=words[n%words.length];f.style.left=(30+Math.random()*40)+'%';f.style.top='20px';$('#cz').appendChild(f);setTimeout(()=>f.remove(),800);
      if(n>=goal){ended=true;$('#nx').disabled=false;$('#cb').textContent='🔥'}};
    $('#nx').onclick=next;
  });
};
const runHome=(hd,next)=>{
  go(`${hd}<div class="card center"><h2>阿進從三壘起跑……</h2>
    <svg class="runfield" viewBox="0 0 300 220"><path d="M150 210 L20 90 Q150 -40 280 90 Z" fill="#2F7A45"/><path d="M150 200 L240 120 L150 40 L60 120 Z" fill="#C98A5A"/>
    <path d="M150 190 L230 120 L150 50 L70 120 Z" fill="#2F7A45"/>
    <rect x="221" y="111" width="18" height="18" transform="rotate(45 230 120)" fill="#E2A92B"/><rect x="141" y="41" width="18" height="18" transform="rotate(45 150 50)" fill="#E2A92B"/><rect x="61" y="111" width="18" height="18" transform="rotate(45 70 120)" fill="#E2A92B"/>
    <path d="M140 182 h20 v8 l-10 10 l-10 -10z" fill="#F4ECDD" stroke="#1B2B45" stroke-width="2" id="hp"/>
    <g id="runner" transform="translate(52 72)"><g style="transform:scale(.18)">${boy({mood:'wow'})}</g></g></svg>
    <h2 id="safe" style="color:var(--red);opacity:0;transition:opacity .4s">SAFE！回到本壘！</h2></div>
    <button class="btn" id="nx" disabled>領取抽獎券</button>`,()=>{
    const g=$('#runner');const a=[52,72],b=[132,150];const t0=performance.now();
    const step=t=>{const p=Math.min(1,(t-t0)/1500);const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      g.setAttribute('transform',`translate(${a[0]+(b[0]-a[0])*e} ${a[1]+(b[1]-a[1])*e})`);
      if(p<1)requestAnimationFrame(step);else{$('#safe').style.opacity=1;$('#hp').setAttribute('fill','#E2A92B');$('#nx').disabled=false}};
    setTimeout(()=>requestAnimationFrame(step),300);
    $('#nx').onclick=next;
  });
};
function addTicket(){S.tickets++;S.ticketIds.push('LT-'+rand(6));save()}
function unlock4(){
  if(!S.done[2])return map();
  if(S.l4)return level4();
  runStages('解鎖第四階段｜現場掃碼',[(hd,next)=>scanStage(hd,next,false)],()=>{S.l4=true;save();
    go(`<div class="card center"><p class="unlock">✓ 現場掃碼成功・${S.venue}</p><h2>第四關權限已開啟！</h2>
      <div class="boy sm" style="margin:0 auto">${boy({mood:'wow'})}</div>
      <p>阿進在三壘蹲好起跑姿勢了。現在就幫他應援，衝回本壘！</p></div>
      <button class="btn" id="s4">開始第四關｜本壘：夢想進場</button>`,()=>$('#s4').onclick=level4)});
}
function level4(){
  if(!S.done[2])return map();
  if(!S.l4)return unlock4();
  if(S.done[3])return lottery();
  runStages('第四階段｜本壘：夢想進場',[
    cheer,
    runHome,
  ],()=>{S.done[3]=true;addTicket();save();ticketView(true)});
}
function ticketView(first){
  const id=S.ticketIds[S.ticketIds.length-1];
  go(`<div><p class="eyebrow">本壘：夢想進場・完成</p><h2>${first?'阿進站上職棒球場了！':'抽獎次數 +1'}</h2></div>
  ${first?`<div class="card center"><div class="badge">${badgeSvg(4)}</div><p class="unlock">📖 解鎖故事：${STORIES[3].title}（可在地圖的故事館閱讀）</p><p class="story" style="font-size:15px;text-align:left">成長故事 4：十年後，${S.venue}。廣播響起：「九號，游擊手——阿進！」他走進打擊區，抬頭看向看台。那個陪他從一壘跑回本壘的人，就是你。</p></div>`:''}
  <div class="ticket"><span class="note" style="color:var(--ink)">耐斯 × 中職 現場抽獎券</span><span class="big">可抽獎次數 ${S.tickets - S.prizes.length}</span><span class="id">${id}・${S.venue}</span></div>
  <div class="card"><h3>怎麼抽？</h3><p>到球場耐斯攤位，向工作人員出示這張抽獎券，工作人員確認後，就能轉一次攤位上的古早味抽獎轉盤（實體轉盤，現場揭曉獎項）。</p></div>
  <button class="btn" id="draw">模擬到攤位出示抽獎券</button>
  <div class="footer-reset"><button class="linkbtn" id="toMap">回壘包地圖</button></div>`,()=>{
    $('#draw').onclick=lottery;$('#toMap').onclick=map;
  });
}

/* ---------- lottery: physical wheel at booth; app only shows & verifies the ticket ---------- */
const PRIZES=[
  {k:'明星賽雙人豪華棒球之旅',qty:'4 組'},
  {k:'中職聯名棒球服',qty:'20 件'},
  {k:'耐斯產品組',qty:'100 組'},
];
function lottery(){
  const left=S.tickets-S.prizes.length;
  const list=S.ticketIds.map((id,i)=>`<div class="tk-row ${i<S.prizes.length?'used':''}"><span class="id">${id}</span><b>${i<S.prizes.length?'已核銷・已抽獎':'可使用'}</b></div>`).join('');
  go(`<div><p class="eyebrow">耐斯攤位・現場抽獎</p><h2>把這個畫面拿給<br>攤位工作人員看</h2></div>
  <div class="ticket" id="tk"><span class="note" style="color:var(--ink)">耐斯 × 中職 現場抽獎券</span><span class="big">可抽獎次數 ${left}</span><span class="id">${S.venue}・已報到 ${S.scans} 場</span>${left===0?'<div class="okstamp">✓ 已全數核銷</div>':''}</div>
  <div class="card"><h3>現場抽獎流程</h3>
    <div class="issues">
      <div class="issue"><b>1</b><span>到球場耐斯攤位，出示這張抽獎券。</span></div>
      <div class="issue"><b>2</b><span>工作人員確認後核銷一次抽獎資格。</span></div>
      <div class="issue"><b>3</b><span>親手轉動攤位上的<strong>古早味抽獎轉盤</strong>，當場揭曉獎項。</span></div>
    </div>
    <div class="tk-list">${list}</div>
  </div>
  <button class="btn" id="cf" ${left>0?'':'disabled'}>${left>0?'模擬：工作人員確認並核銷 1 次':'抽獎資格已使用完畢'}</button>
  <div id="res"></div>
  <div class="card"><h3>現場獎項（依企畫書）</h3><div class="prizes">${PRIZES.map(p=>`<div><span>${p.k}</span><b>${p.qty}</b></div>`).join('')}</div>
    <p class="note">獎項由現場轉盤抽出，App 只負責確認抽獎資格。參加多場指定賽事可累積抽獎次數。</p></div>
  <button class="btn ghost" id="more">模擬參加另一場指定賽事（抽獎次數 +1）</button>
  <button class="btn gold" id="fin">查看完賽證書</button>`,()=>{
    $('#cf').onclick=()=>{if(S.tickets-S.prizes.length<=0)return;S.prizes.push('used');save();lottery();
      setTimeout(()=>{$('#res').innerHTML=`<div class="prize"><span class="note">工作人員已核銷</span><span class="p">請轉動現場轉盤！</span><span>祝你抽中明星賽雙人棒球之旅</span></div>`;$('#res').scrollIntoView({behavior:'smooth',block:'center'})},50)};
    $('#more').onclick=()=>runStages('多場累積・再次報到',[(hd,next)=>scanStage(hd,next,true)],()=>{addTicket();ticketView(false)});
    $('#fin').onclick=finish;
  });
}

/* ---------- 偏鄉球隊故事館 ---------- */

function storyHall(){
  go(`<div><p class="eyebrow">偏鄉球隊故事館</p><h2>那些從鄉下打出來的好球</h2><p class="note" style="margin-top:6px">每完成一個壘包，就解鎖一則真實故事。內容來自本活動規劃合作的公益夥伴<a href="https://basegarden.org/" target="_blank" rel="noopener" style="color:var(--navy)">球芽基金 Basegarden</a>（合作洽談中）。</p></div>
  <div class="hall">${STORIES.map((t,i)=>{const ok=S.done[i];return `<button class="sv ${ok?'':'locked'}" data-i="${i}"><span class="yr">${ok?t.year:'？'}<small>${ok?t.place:'未解鎖'}</small></span>
    <span class="bd"><b>${ok?t.title:'🔒 '+t.unlock}${ok&&!S.read.includes(i)?'<span class="new">NEW</span>':''}</b><span>${ok?t.lead.slice(0,30)+'…':'繼續陪阿進前進，就能讀到這則故事'}</span></span></button>`}).join('')}</div>
  <button class="btn navy" id="bk">回壘包地圖</button>`,()=>{
    document.querySelectorAll('.sv').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(!S.done[i])return;storyView(i,storyHall)});
    $('#bk').onclick=map;
  });
}
function storyView(i,back){
  const t=STORIES[i];if(!S.read.includes(i)){S.read.push(i);save()}
  go(`<div class="yearhead"><span class="pl">${t.place}</span><span class="y">${t.year}</span><h2>${t.title}</h2></div>
  <div class="card"><p class="story">${t.lead}</p><div>${t.facts.map(f=>`<div class="fact"><b>${f[0]}</b><span>${f[1]}</span></div>`).join('')}</div>
  <div class="link-ajin">${t.ajin}</div>
  <p class="src">資料來源：${t.src.map(x=>x[1]?`<a href="${x[1]}" target="_blank" rel="noopener">${x[0]}</a>`:x[0]).join('、')}</p></div>
  <div class="row">${i>0&&S.done[i-1]?'<button class="btn ghost" id="pv">上一則</button>':''}${i<3&&S.done[i+1]?'<button class="btn ghost" id="nv">下一則</button>':''}</div>
  <button class="btn" id="bk">返回</button>`,()=>{
    $('#bk').onclick=back;const pv=$('#pv'),nv=$('#nv');if(pv)pv.onclick=()=>storyView(i-1,back);if(nv)nv.onclick=()=>storyView(i+1,back);
  });
}

/* ---------- finish ---------- */
function finish(){
  go(`<div class="cert">

  <button class="btn ghost" id="toHall2">📖 偏鄉球隊故事館</button>

  <div class="footer-reset"><button class="linkbtn" id="rs">重置進度（換下一位評審）</button></div>`,()=>{
    $('#toMap').onclick=map;$('#rs').onclick=resetAll;$('#toHall2').onclick=storyHall;
  });
}

home();
